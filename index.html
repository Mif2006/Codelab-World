<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Code Lab — Premium Web Development & UI/UX Design Studio</title>
    <meta name="description" content="Code Lab builds high-performance, SEO-optimized websites that convert. From landing pages to e-commerce platforms — tailored web solutions that grow your business." />
    <meta name="author" content="Code Lab" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://codelab.studio" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codelab.studio" />
    <meta property="og:title" content="Code Lab — Web Development & UI/UX Design Studio" />
    <meta property="og:description" content="High-converting websites built with modern tech. Landing pages, e-commerce, corporate sites — crafted for performance and growth." />
    <meta property="og:image" content="https://codelab.studio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Code Lab" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://codelab.studio" />
    <meta name="twitter:title" content="Code Lab — Premium Web Development & UI/UX Design Studio" />
    <meta name="twitter:description" content="High-converting websites built with modern tech. Landing pages, e-commerce, corporate sites — crafted for performance and growth." />
    <meta name="twitter:image" content="https://codelab.studio/twitter-image.jpg" />
    
    <!-- Performance Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical fonts if used -->
    <!-- <link rel="preload" href="/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin /> -->
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0a0601" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Code Lab",
        "url": "https://codelab.studio",
        "logo": "https://codelab.studio/logo.png",
        "description": " web development and UI/UX design studio specializing in high-performance, conversion-focused websites.",
        "sameAs": [
          "https://instagram.com/codelab",
          "https://linkedin.com/company/codelab"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "availableLanguage": ["English"]
        }
      }
    </script>
    
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Code Lab",
        "url": "https://codelab.studio",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://codelab.studio/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
